[package]
name = "lanlm-mesh"
version = "0.2.0"
description = "LanLM mesh: secure device discovery, shared cluster state, scheduling and a load-balancing gateway for llama.cpp."
authors = ["LanLM contributors"]
license = "MIT"
repository = "https://github.com/sakthiveltofficial/lanlm"
edition = "2021"
rust-version = "1.82"

[lib]
name = "lanlm_mesh"

[[bin]]
name = "lanlm-node"
path = "src/bin/lanlm-node.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "time", "sync", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sysinfo = "0.40"
snow = "0.9"
mdns-sd = "0.21"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
data-encoding = "2"
bytes = "1"
if-addrs = "0.13"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
