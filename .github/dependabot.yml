version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (npm install fails).
      # Remove this once typescript-eslint publishes a release that supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        patterns: ["eslint*", "@eslint/*", "typescript*", "prettier", "vitest", "@vitest/*", "@types/*", "globals"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
